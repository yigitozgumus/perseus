name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v*

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: JitPack publish dry run
        run: ./gradlew :perseus-core:publishReleasePublicationToMavenLocal :perseus-interop:publishReleasePublicationToMavenLocal
