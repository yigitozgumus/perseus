site_name: Perseus
site_description: Type-safe AndroidX Navigation 3 routing for Jetpack Compose and Fragment interop
site_author: Yigit Ozgumus
repo_name: yigitozgumus/perseus
repo_url: https://github.com/yigitozgumus/perseus
edit_uri: edit/main/docs/
site_dir: build/site
remote_branch: gh-pages

copyright: Copyright &copy; 2026 Yigit Ozgumus

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yigitozgumus/perseus

nav:
  - Overview: index.md
  - Guide:
      - Getting started: getting-started.md
      - Navigation: navigation.md
      - Scenes & interop: scenes-interop.md
      - Advanced: advanced.md
  - Reference:
      - Recipes: recipes.md
      - Changelog: changelog.md
